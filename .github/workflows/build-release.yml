name: Build and release exe

# Publishes a fresh RekordboxNowPlaying.zip under the "latest" release on
# every push to main, so RequestApp's dashboard download link can always
# fetch a current build without anyone manually rebuilding/re-uploading it.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build app
        run: |
          # --onedir (the default, so no --onefile flag): onefile's runtime
          # self-extraction into a temp directory is exactly the behavior
          # pattern antivirus heuristics associate with malware droppers.
          # Unpacking everything at build time instead measurably reduces
          # false-positive detections for an unsigned exe like this one.
          pyinstaller --noconfirm --clean --windowed `
            --name "RekordboxNowPlaying" `
            --icon "app_icon.ico" `
            main.py
          Compress-Archive -Path "dist/RekordboxNowPlaying/*" -DestinationPath "dist/RekordboxNowPlaying.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built from the latest commit on main.
          files: dist/RekordboxNowPlaying.zip
          make_latest: true
